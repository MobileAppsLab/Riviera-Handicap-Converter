<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f5d2a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Golf Handicap">
<link rel="manifest" href="manifest.json">
<title>Golf Handicap</title>
<style>
:root{--g:#1f5d2a;--lg:#eaf3e8;--gold:#fff7d6;--gray:#68706b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#f5f6f4;color:#17301e;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:520px;margin:auto;padding:env(safe-area-inset-top) 18px 28px}
header{margin:0 -18px 26px;padding:21px 18px 18px;background:var(--g);color:#fff;text-align:center}
h1{margin:0;font-size:29px}.sub{font-size:14px;margin-top:5px;opacity:.9}
label{display:block;text-align:center;font-size:18px;font-weight:700;color:var(--g);margin-bottom:10px}
input{width:100%;height:68px;border:2px solid #d8ddd8;border-radius:16px;background:var(--gold);color:var(--g);text-align:center;font-size:34px;font-weight:700;outline:0}
input:focus{border-color:var(--g)}
.title{margin-top:26px;background:var(--g);color:#fff;border-radius:14px 14px 0 0;text-align:center;padding:12px;font-size:15px;font-weight:800}
.result{background:var(--lg);border-radius:0 0 14px 14px;text-align:center;padding:15px 10px 19px;font-size:58px;line-height:1;font-weight:800;color:var(--g)}
.course{margin-top:22px;background:#fff;border-radius:14px;overflow:hidden;border:1px solid #e0e3e0}
.row{display:flex;justify-content:space-between;padding:13px 17px;border-bottom:1px solid #eceeec;font-size:16px}
.row:last-child{border:0}.row b{color:var(--g)}
button{width:100%;margin-top:17px;height:50px;border:1px solid #d9ddd9;border-radius:13px;background:#fff;color:var(--g);font-size:16px;font-weight:700}
.note{margin-top:19px;text-align:center;color:var(--gray);font-size:12px;line-height:1.45}
</style>
</head>
<body>
<div class="app">
<header><h1>GOLF HANDICAP</h1><div class="sub">Riviera Country Club</div></header>
<label for="hi">Handicap Index</label>
<input id="hi" type="number" inputmode="decimal" step="0.1" min="0" max="54" value="18.4">
<div class="title">COURSE HANDICAP</div>
<div class="result" id="result">14</div>
<div class="course">
<div class="row"><span>Course Rating</span><b>57.8</b></div>
<div class="row"><span>Slope Rating</span><b>89</b></div>
<div class="row"><span>Par</span><b>58</b></div>
</div>
<button id="clear">Enter New Handicap</button>
<div class="note">Course Handicap = HI × (Slope ÷ 113) + (Rating − Par)<br>Rounded to the nearest whole number.</div>
</div>
<script>
const hi=document.getElementById("hi"),out=document.getElementById("result");
function calc(){const h=parseFloat(hi.value);out.textContent=Number.isFinite(h)?Math.round(h*(89/113)+(57.8-58)):"—";}
hi.addEventListener("input",calc);
document.getElementById("clear").onclick=()=>{hi.value="";out.textContent="—";hi.focus()};
calc();
if("serviceWorker"in navigator) navigator.serviceWorker.register("service-worker.js").catch(()=>{});
</script>
</body>
</html>
